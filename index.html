<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Statique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 400px; width: 100%; }
  </style>
</head>
<body>
  <div id="map">
    <img id="staticMap" style="width:100%; height:100%;" />
  </div>

  <script>
    // Récupérer latitude, longitude et zoom depuis l'URL
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 48.8566;   // Paris par défaut
    const lon = parseFloat(params.get('lon')) || 2.3522;
    const zoom = parseInt(params.get('zoom')) || 13;

    // Construire l'URL de la carte statique OpenStreetMap
    const size = '600x400'; // largeur x hauteur en pixels
    const marker = `${lat},${lon},red-pushpin`; 
    const url = `https://staticmap.openstreetmap.de/staticmap.php?center=${lat},${lon}&zoom=${zoom}&size=${size}&markers=${marker}`;

    // Ajouter l'image dans le div
    document.getElementById('staticMap').src = url;
  </script>
</body>
</html>
