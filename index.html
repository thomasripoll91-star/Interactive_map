<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Statique Leaflet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    img { max-width: 100%; border: 2px solid #333; }
    a { display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Carte Statique</h2>
  <div id="output"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-image/leaflet-image.js"></script>
  <script>
    // Récupérer latitude, longitude et zoom depuis l'URL
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat')) || 48.8566; // Paris par défaut
    const lon = parseFloat(params.get('lon')) || 2.3522;
    const zoom = parseInt(params.get('zoom')) || 13;

    // Créer une carte Leaflet hors écran, invisible
    const mapContainer = document.createElement('div');
    mapContainer.style.width = "800px";  // largeur de l'image
    mapContainer.style.height = "600px"; // hauteur de l'image
    mapContainer.style.display = "none"; // cache le div
    document.body.appendChild(mapContainer);

    const map = L.map(mapContainer, {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      tap: false,
      touchZoom: false,
    }).setView([lat, lon], zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    L.marker([lat, lon]).addTo(map);

    // Générer l'image statique
    leafletImage(map, function(err, canvas) {
      if (err) { console.error(err); return; }

      const img = document.createElement('img');
      img.src = canvas.toDataURL();
      document.getElementById('output').appendChild(img);

      const link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = 'map.png';
      link.textContent = 'Télécharger l’image';
      document.getElementById('output').appendChild(link);

      // Supprimer la carte Leaflet invisible
      map.remove();
      mapContainer.remove();
    });
  </script>
</body>
</html>
